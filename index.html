
<!DOCTYPE html>
<html lang="ru">
<head>

            font-size: 32px;
        }

        h2 {

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #c4b5fd;
        }

        a {
            display: inline-block;
            margin: 8px;
            padding: 12px 20px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
